# lean-forge's own gate chain: the project is developed with itself.

[gates]
test = "python3 -m unittest discover -s tests -q"
lint = "ruff check lean_forge tests bin/lean-forge"
# Every golden task in .lean-forge/evals has a recorded result equal to its expectation.
evals = "python3 bin/lean-forge eval --check"

[control]
# Nearly everything here is a control: the engine, its prompts, its rules and its tests.
paths = ["lean_forge/", "bin/", "prompts/", "rules/", "skills/", "hooks/", "templates/", "tests/",
         ".claude-plugin/", ".lean-forge/", "pyproject.toml", "AGENTS.md", "CLAUDE.md"]

[review]
max_iterations = 8
autofix = true
focus = """
- Standard library only, Python 3.11+. A new third-party dependency is a MAJOR finding.
- Effectful primitives must check evidence for the exact tree they act on. Flag any path that commits,
  pushes or records evidence without that check, or that trusts the working tree where HEAD or the
  remote base is the authority (configuration, gates, routes).
- Flag mechanism that re-grows heavyweight guarantees (persisted state machines, markers, replay,
  crash recovery) without a stated incident. Simplicity is a requirement here, not a preference.
- Reviewers must stay read-only and writers must never move HEAD. Check every provider path for it.
- Shell boundaries: commands are argv lists except configured gate strings; check quoting, timeouts
  and output caps.
"""

[approval]
mode = "none"

[land]
remote = "origin"
branch = "main"
review = "none"

[routes.review-cheap]
provider = "codex"
model = "gpt-5.6-terra"
effort = "medium"

[routes.review-final]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[routes.fix]
provider = "claude"
model = "claude-opus-5-5"
effort = "high"

[routes.implement]
provider = "codex"
model = "gpt-6-sol"
effort = "high"
