[project]
name = "lean-forge"
version = "0.1.0"
description = "Autonomous, mechanical gate chain for agent-written code (Claude Code plugin)"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 132
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ISC", "PLW1510", "RUF100", "FURB167"]
